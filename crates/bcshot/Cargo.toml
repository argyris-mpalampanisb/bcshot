[package]
name = "bcshot"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "Bandicam-style fixed-rectangle screenshots: background app (frame, tray, hotkeys)"

[dependencies]
bcshot-common = { path = "../common" }
# Frame overlay window (transparent, click-through, always on top)
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Screen capture: X11 + Wayland (xdg-desktop-portal / wlroots screencopy)
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = "0.4"
anyhow = "1"
# System tray (KDE StatusNotifierItem; GNOME needs the AppIndicator extension)
ksni = { version = "0.3", features = ["blocking"] }
# Desktop notifications with thumbnail + actions
notify-rust = "4"
evdev = "0.13.2"
